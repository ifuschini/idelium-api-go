name: idelium-api-go-smoke

# Isolated consumer-smoke profile. It never shares networks, volumes, or
# credentials with the Laravel development/production Compose projects.
services:
  mysql:
    image: mariadb:10.6.22@sha256:7589b386fa6686a5d5f131b504ed21c81e492c48b78c6c4be0d5be1066542559
    environment:
      MARIADB_DATABASE: ${SMOKE_DB_NAME:-idelium_smoke}
      MARIADB_USER: ${SMOKE_DB_USER:-idelium_smoke}
      MARIADB_PASSWORD: ${SMOKE_DB_PASSWORD:?SMOKE_DB_PASSWORD must be set}
      MARIADB_ROOT_PASSWORD: ${SMOKE_DB_ROOT_PASSWORD:?SMOKE_DB_ROOT_PASSWORD must be set}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping --silent --host=127.0.0.1 --user=root --password=$$MARIADB_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [smoke]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: smoke
        SOURCE_REVISION: ${SOURCE_REVISION:-working-tree}
    environment:
      IDELIUM_ENVIRONMENT: smoke
      IDELIUM_HTTP_ADDRESS: ":8080"
      IDELIUM_DB_HOST: mysql
      IDELIUM_DB_PORT: "3306"
      IDELIUM_DB_NAME: ${SMOKE_DB_NAME:-idelium_smoke}
      IDELIUM_DB_USER: ${SMOKE_DB_USER:-idelium_smoke}
      IDELIUM_DB_PASSWORD: ${SMOKE_DB_PASSWORD:?SMOKE_DB_PASSWORD must be set}
      IDELIUM_DB_TLS_MODE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/idelium-api-go", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${SMOKE_API_PORT:-18080}:8080"
    networks: [smoke]
    security_opt: [no-new-privileges:true]
    read_only: true
    cap_drop: [ALL]

networks:
  smoke:
    name: idelium-api-go-smoke
    driver: bridge
