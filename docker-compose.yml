name: idelium-local

services:
  db:
    image: mariadb:10.6.22@sha256:7589b386fa6686a5d5f131b504ed21c81e492c48b78c6c4be0d5be1066542559
    environment:
      MARIADB_DATABASE: idelium_dev
      MARIADB_USER: idelium_dev
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [local]
    secrets: [db_password]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./smoke/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./smoke/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro

  api-go:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
        SOURCE_REVISION: local
    environment:
      IDELIUM_ENVIRONMENT: development
      IDELIUM_HTTP_ADDRESS: ":8080"
      IDELIUM_DB_HOST: db
      IDELIUM_DB_PORT: "3306"
      IDELIUM_DB_NAME: idelium_dev
      IDELIUM_DB_USER: idelium_dev
      IDELIUM_DB_PASSWORD_FILE: /run/secrets/db_password
      IDELIUM_DB_TLS_MODE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/idelium-api-go", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [local]
    ports:
      - "${DEV_GO_API_PORT:-18080}:8080"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    secrets: [db_password]

  api-laravel:
    build:
      context: ../idelium-api/ideliumapi
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -c
      - export DB_PASSWORD="$$(cat /run/secrets/db_password)"; exec /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: idelium_dev
      DB_USERNAME: idelium_dev
      SESSION_SECURE_COOKIE: "false"
      SESSION_DOMAIN: localhost
    depends_on:
      db:
        condition: service_healthy
    networks: [local]
    ports:
      - "${DEV_LARAVEL_API_PORT:-18081}:80"
    secrets: [db_password]
    security_opt: [no-new-privileges:true]

networks:
  local:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/dev_db_password
