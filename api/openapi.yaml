openapi: 3.0.3
info:
  title: Idelium API Go
  version: 0.1.0
  description: >-
    Contract for the incremental Go replacement of the Idelium API. Business
    routes are added only after compatibility and tenant-isolation review.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report process liveness
      tags: [Operations]
      responses:
        "200":
          description: The API process is alive.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report service readiness
      tags: [Operations]
      responses:
        "200":
          description: Required dependencies are ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: A required dependency is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/platforms/types:
    get:
      operationId: listPlatformTypes
      summary: List platform target types
      tags: [Platform Catalog]
      responses:
        "200":
          description: Legacy-compatible platform type array.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformCatalogItem"
        "500":
          description: The platform catalog is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/platforms/status:
    get:
      operationId: listPlatformStatuses
      summary: List platform statuses
      tags: [Platform Catalog]
      responses:
        "200":
          description: Legacy-compatible platform status array.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformCatalogItem"
        "500":
          description: The platform catalog is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ideliumcl/testcycle/{idTestCycle}:
    get:
      operationId: getCLITestCycle
      summary: Read one CLI test-cycle configuration
      description: >-
        Returns the Laravel-compatible test-cycle row for the authenticated
        customer. Missing and cross-tenant identifiers both return the legacy
        `Invalid id` response to avoid revealing foreign tenant resources.
      tags: [CLI Configuration]
      x-idelium-laravel-route: "/api/ideliumcl/testcycle/{idTestCycle}"
      x-idelium-controller: "App\\Http\\Controllers\\IdeliumClController@getTestCycle"
      x-idelium-current-owner: "go-application"
      x-idelium-trust-path: "api-key"
      x-idelium-authentication-mode: "api-key"
      x-idelium-tenant-context: true
      x-idelium-consumers: ["idelium-cli", "idelium-docker-wiki"]
      parameters:
        - name: idTestCycle
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Laravel-compatible test-cycle row.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CLITestCycle"
        "401":
          description: The legacy customer API key is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyMessageResponse"
        "404":
          description: The test cycle is missing or outside the customer tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyMessageResponse"
        "500":
          description: The CLI configuration could not be loaded.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ideliumcl/test/{idTest}:
    get:
      operationId: getCLITest
      summary: Read one CLI test configuration
      description: >-
        Returns the Laravel-compatible test row for the authenticated customer.
        Missing and cross-tenant identifiers both return the legacy `Invalid id`
        response to avoid revealing foreign tenant resources.
      tags: [CLI Configuration]
      x-idelium-laravel-route: "/api/ideliumcl/test/{idTest}"
      x-idelium-controller: "App\\Http\\Controllers\\IdeliumClController@getTest"
      x-idelium-current-owner: "go-application"
      x-idelium-trust-path: "api-key"
      x-idelium-authentication-mode: "api-key"
      x-idelium-tenant-context: true
      x-idelium-consumers: ["idelium-cli", "idelium-docker-wiki"]
      parameters:
        - name: idTest
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Laravel-compatible test row.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CLITest"
        "401":
          description: The legacy customer API key is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyMessageResponse"
        "404":
          description: The test is missing or outside the customer tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyMessageResponse"
        "500":
          description: The CLI configuration could not be loaded.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
