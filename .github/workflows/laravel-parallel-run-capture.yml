name: Laravel parallel-run capture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Go repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout Laravel repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ifuschini/idelium-api
          path: laravel
          ref: dependabot/composer/laravel/pint-1.30.0

      - name: Start isolated Laravel profile
        working-directory: laravel
        env:
          CAPTURE_DB_PASSWORD: capture_pw
          CAPTURE_DB_ROOT_PASSWORD: capture_root
        run: docker compose -f compose.capture.yml up -d --build --force-recreate

      - name: Prepare Laravel database
        working-directory: laravel
        env:
          CAPTURE_DB_PASSWORD: capture_pw
          CAPTURE_DB_ROOT_PASSWORD: capture_root
        run: |
          docker compose -f compose.capture.yml exec -T api php artisan migrate --force
          docker compose -f compose.capture.yml exec -T api php artisan db:seed --class=ParallelRunCaptureSeeder --force

      - name: Capture and validate fixtures
        env:
          CAPTURE_LARAVEL_BASE_URL: http://localhost:18082
          CAPTURE_LARAVEL_REVISION: ${{ github.sha }}
          CAPTURE_API_KEY: fixture-cli-key-9001
        run: |
          test -n "$CAPTURE_API_KEY"
          jar=$(mktemp); headers=$(mktemp)
          curl --fail --silent --show-error --cookie-jar "$jar" --dump-header "$headers" -H 'Accept: application/json' http://localhost:18082/api/sanctum/csrf-cookie >/dev/null
          raw=$(sed -n 's/^Set-Cookie: XSRF-TOKEN=\([^;]*\).*/\1/p' "$headers" | tail -1)
          token=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))' <<<"$raw")
          curl --fail --silent --show-error --cookie "$jar" --cookie-jar "$jar" -H 'Accept: application/json' -H "X-XSRF-TOKEN: $token" -H "X-CSRF-TOKEN: $token" -H 'Content-Type: application/json' -d '{"email":"fixture-smoke@example.invalid","password":"SmokePassword123!"}' http://localhost:18082/api/login >/dev/null
          export CAPTURE_BROWSER_COOKIE=$(awk 'NF>=7{v[$6]=$6"="$7} END{for(k in v) printf "%s;",v[k]}' "$jar")
          raw_token=$(awk '$0 !~ /^#/ && $6=="XSRF-TOKEN"{v=$7} END{print v}' "$jar")
          export CAPTURE_XSRF_TOKEN=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))' <<<"$raw_token")
          export CAPTURE_RUN_TOKEN=$(curl --fail --silent --show-error \
            -H 'Accept: application/json' -H 'Idelium-Key: fixture-cli-key-9001' \
            -H 'Content-Type: application/json' \
            -d '{"agentId":"fixture-agent-smoke"}' \
            http://localhost:18082/api/ideliumcl/projects/9001/parallel-runs/9001/tokens \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          python3 scripts/capture_parallel_runs.py \
            --plan testdata/parallel-run-capture-extended.json \
            --output-dir testdata/golden/laravel-parallel-runs
          python3 scripts/validate_golden_fixtures.py testdata/golden/laravel-parallel-runs

      - name: Commit captured fixtures
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add testdata/golden/laravel-parallel-runs
          git diff --cached --quiet || git commit -m "test: capture Laravel parallel-run fixtures"
          git push

      - name: Tear down capture profile
        if: always()
        working-directory: laravel
        env:
          CAPTURE_DB_PASSWORD: capture_pw
          CAPTURE_DB_ROOT_PASSWORD: capture_root
        run: docker compose -f compose.capture.yml down --volumes --remove-orphans
