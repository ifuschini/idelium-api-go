components:
  headers:
    CorrelationID:
      description: >-
        Validated request correlation identifier. A caller-provided identifier
        is preserved only when it contains 1-128 safe ASCII characters;
        otherwise the API generates a replacement.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    HealthCacheControl:
      description: Health responses must not be served from a cache.
      schema:
        type: string
        enum: [no-store]
  responses:
    LegacyCompatibilityResponse:
      description: >-
        Laravel-compatible response whose exact body is captured by sanitized
        golden fixtures before native Go ownership.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyCompatibilityPayload"
    LegacyCompatibilityError:
      description: Laravel-compatible error response.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated principal cannot access this tenant resource.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: The request failed Laravel-compatible validation.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LegacyCompatibilityPayload:
      type: object
      additionalProperties: true
    BuildInfo:
      type: object
      required: [service, version, commit]
      properties:
        service:
          type: string
          example: idelium-api-go
        version:
          type: string
        commit:
          type: string
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/BuildInfo"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
    ReadinessResponse:
      allOf:
        - $ref: "#/components/schemas/HealthResponse"
        - type: object
          required: [dependencies]
          properties:
            dependencies:
              type: object
              required: [database]
              properties:
                database:
                  type: string
                  enum: [ok]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
    LegacyMessageResponse:
