openapi: 3.0.3
info:
  title: Idelium API Go
  version: 0.1.0
  description: >-
    Contract for the incremental Go replacement of the Idelium API. Business
    routes are added only after compatibility and tenant-isolation review.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report process liveness
      tags: [Operations]
      responses:
        "200":
          description: The API process is alive.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report service readiness
      tags: [Operations]
      responses:
        "200":
          description: Required dependencies are ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: A required dependency is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/platforms/types:
    get:
      operationId: listPlatformTypes
      summary: List platform target types
      tags: [Platform Catalog]
      responses:
        "200":
          description: Legacy-compatible platform type array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformCatalogItem"
        "500":
          description: The platform catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/platforms/status:
    get:
      operationId: listPlatformStatuses
      summary: List platform statuses
      tags: [Platform Catalog]
      responses:
        "200":
          description: Legacy-compatible platform status array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformCatalogItem"
        "500":
          description: The platform catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  headers:
    HealthCacheControl:
      description: Health responses must not be served from a cache.
      schema:
        type: string
        enum: [no-store]
  schemas:
    BuildInfo:
      type: object
      required: [service, version, commit]
      properties:
        service:
          type: string
          example: idelium-api-go
        version:
          type: string
        commit:
          type: string
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/BuildInfo"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
    ReadinessResponse:
      allOf:
        - $ref: "#/components/schemas/HealthResponse"
        - type: object
          required: [dependencies]
          properties:
            dependencies:
              type: object
              required: [database]
              properties:
                database:
                  type: string
                  enum: [ok]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
    PlatformCatalogItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
