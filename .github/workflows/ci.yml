name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.6
          cache: true

      - name: Verify locked modules
        run: go mod verify

      - name: Check formatting
        run: make format-check

      - name: Run static checks
        run: make vet

      - name: Run unit tests
        run: make test

      - name: Run race tests
        run: make test-race

      - name: Run contract tests
        run: make contract-test

      - name: Scan Go dependencies and reachable code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Build binaries
        run: make build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mariadb:10.6.22@sha256:7589b386fa6686a5d5f131b504ed21c81e492c48b78c6c4be0d5be1066542559
        env:
          MARIADB_DATABASE: idelium_test
          MARIADB_USER: idelium_test
          MARIADB_PASSWORD: integration-test-password
          MARIADB_ROOT_PASSWORD: integration-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent --host=127.0.0.1 --user=root --password=integration-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache: true

      - name: Run MySQL integration tests
        env:
          IDELIUM_TEST_MYSQL_HOST: 127.0.0.1
          IDELIUM_TEST_MYSQL_PORT: 3306
          IDELIUM_TEST_MYSQL_DATABASE: idelium_test
          IDELIUM_TEST_MYSQL_USER: idelium_test
          IDELIUM_TEST_MYSQL_PASSWORD: integration-test-password
        run: go test -count=1 ./internal/persistence/mysql

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build container
        run: >-
          docker build
          --build-arg VERSION=ci
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --tag idelium/api-go:ci
          .

      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' idelium/api-go:ci)" = "65532:65532"

      - name: Generate CycloneDX SBOM
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          anchore/syft:v1.50.0@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026
          idelium/api-go:ci
          --output cyclonedx-json
          > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: idelium-api-go-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Scan runtime image vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
          image
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          idelium/api-go:ci
